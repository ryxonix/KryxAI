# KryxAI — Fabric channel/system-channel config for the anchor network.
# Single org (Org1), single orderer, no TLS for the simple dev/local profile.
#
#   configtxgen -profile KryxAIGenesis -outputBlock ./channel-artifacts/genesis.block -channelID systemchannel
#   configtxgen -profile KryxAIChannel -outputCreateChannelTx ./channel-artifacts/channel.tx -channelID mychannel
#   configtxgen -profile KryxAIChannel -outputAnchorPeersUpdate ./channel-artifacts/anchors.tx -channelID mychannel -asOrg Org1MSP

Organizations:
  - &OrdererOrg
    Name: OrdererOrg
    ID: OrdererMSP
    MSPDir: crypto-config/ordererOrganizations/kryxai.example.com/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('OrdererMSP.member')"
      Writers:
        Type: Signature
        Rule: "OR('OrdererMSP.member')"
      Admins:
        Type: Signature
        Rule: "OR('OrdererMSP.admin')"

  - &Org1
    Name: Org1MSP
    ID: Org1MSP
    MSPDir: crypto-config/peerOrganizations/kryxai.example.com/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('Org1MSP.admin', 'Org1MSP.peer', 'Org1MSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('Org1MSP.admin', 'Org1MSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('Org1MSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('Org1MSP.peer')"
    AnchorPeers:
      # Resolved by configtxgen from the environment (see scripts/gen-crypto.sh).
      # Defaults to the compose network alias; scripts/deploy-codespace.sh
      # overrides it to 127.0.0.1 because host networking has no Docker DNS.
      - Host: ${PEER_HOST}
        Port: 7051

Capabilities:
  Channel: &ChannelCapabilities
    V2_0: true
  Orderer: &OrdererCapabilities
    V2_0: true
  Application: &ApplicationCapabilities
    V2_0: true

Application: &ApplicationDefaults
  Organizations:
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
    LifecycleEndorsement:
      Type: ImplicitMeta
      Rule: "MAJORITY Endorsement"
    Endorsement:
      Type: ImplicitMeta
      Rule: "MAJORITY Endorsement"
  Capabilities:
    <<: *ApplicationCapabilities

Orderer: &OrdererDefaults
  OrdererType: solo
  Addresses:
    # Substituted by configtxgen from the environment. This address is baked
    # into the genesis block and every channel config, so a peer or client that
    # cannot resolve it will silently fail to receive blocks.
    # scripts/gen-crypto.sh defaults this to the compose network alias;
    # scripts/deploy-codespace.sh overrides it to 127.0.0.1:7050 for host
    # networking, where Docker service DNS does not exist.
    - ${ORDERER_ADDRESS}
  BatchTimeout: 2s
  BatchSize:
    MaxMessageCount: 10
    AbsoluteMaxBytes: 99 MB
    PreferredMaxBytes: 512 KB
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
    BlockValidation:
      Type: ImplicitMeta
      Rule: "ANY Writers"
  Organizations:
  Capabilities:
    <<: *OrdererCapabilities

Channel: &ChannelDefaults
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
  Capabilities:
    <<: *ChannelCapabilities

Profiles:
  KryxAIGenesis:
    <<: *ChannelDefaults
    Orderer:
      <<: *OrdererDefaults
      Organizations:
        - *OrdererOrg
    Consortiums:
      KryxAIConsortium:
        Organizations:
          - *Org1
  KryxAIChannel:
    <<: *ChannelDefaults
    Consortium: KryxAIConsortium
    Application:
      <<: *ApplicationDefaults
      Organizations:
        - *Org1