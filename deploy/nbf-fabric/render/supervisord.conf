; KryxAI — process manager for the single-container NBF anchor image.
; Runs orderer, ipfs, chaincode (ccaas server), peer and the REST gateway in one
; container. Logs go to stdout/stderr of the container (Render / Cloud Run).
; NOTE: no [unix_http_server]/[rpcinterface:supervisor]/[supervisorctl] sections
; on purpose — no process uses supervisorctl, and the rpcinterface key format
; differs across supervisord versions (3.x vs 4.x), which made startup fail.

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/app/run/supervisord.pid
childlogdir=/app/run
loglevel=info

; ---------------------------------------------------------------- orderer
[program:orderer]
priority=100
command=/usr/local/bin/orderer
directory=/app
autostart=true
autorestart=true
startsecs=5
startretries=20
stopwaitsecs=15
environment=FABRIC_CFG_PATH="/app/config",GOMEMLIMIT="128MiB",GOGC="200"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ------------------------------------------------------------------ ipfs
[program:ipfs]
priority=110
command=/bin/bash /app/scripts/ipfs-start.sh
autostart=true
autorestart=true
startsecs=5
startretries=50
stopwaitsecs=15
environment=IPFS_PATH="/app/data/ipfs",GOMEMLIMIT="96MiB"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ----------------------------------------------- chaincode ccaas server
[program:chaincode]
priority=120
command=/bin/bash /app/scripts/chaincode-run.sh
autostart=true
autorestart=true
startsecs=3
startretries=50
stopwaitsecs=10
environment=CHAINCODE_SERVER_ADDRESS="127.0.0.1:9999",GOMEMLIMIT="64MiB"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ------------------------------------------------------------------ peer
[program:peer]
priority=200
command=/usr/local/bin/peer node start
directory=/app
autostart=true
autorestart=true
startsecs=8
startretries=60
stopwaitsecs=20
environment=FABRIC_CFG_PATH="/app/config",GOMEMLIMIT="340MiB",GOGC="100"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ---------------------------------------------------------------- gateway
[program:gateway]
priority=300
command=/bin/bash -c "bash /app/scripts/wait-peer.sh && cd /app/gateway && exec /usr/bin/node server.js"
autostart=true
autorestart=true
startsecs=3
startretries=100
stopwaitsecs=10
environment=CCP_FILE="/app/data/connection-org1.json",WALLET_DIR="/app/data/wallet",AS_LOCALHOST="true",IPFS_API_HOST="127.0.0.1",IPFS_API_PORT="5001",IPFS_GATEWAY="http://127.0.0.1:8080",GATEWAY_PORT="4000",NODE_ENV="production"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0